services:
  - type: web
    name: myntrarank-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://myntrarank.vercel.app,https://chan570.github.io
      - key: COOKIE_SAME_SITE
        value: none
      - key: PORT
        value: 10000
      - key: OPENSEARCH_NODE
        sync: false
      - key: OPENSEARCH_USERNAME
        sync: false
      - key: OPENSEARCH_PASSWORD
        sync: false
      - key: NLP_SERVICE_URL
        fromService:
          type: pserv
          name: myntrarank-sentiment
          property: hostport

  - type: pserv
    name: myntrarank-sentiment
    runtime: python
    buildCommand: pip install -r server/nlp_service/requirements.txt
    startCommand: cd server/nlp_service && uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PORT
        value: 8000
      - key: SENTIMENT_MODEL_ID
        value: cardiffnlp/twitter-roberta-base-sentiment-latest
